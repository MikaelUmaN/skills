name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Validate marketplaces and skills
        run: uv run tools/validate_marketplaces.py
      - name: Run tests
        run: uv run --group dev pytest -q
